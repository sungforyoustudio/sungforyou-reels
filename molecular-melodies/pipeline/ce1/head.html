<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#06141A}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas><script src="cfg.js"></script><script>
const LAND=!!CFG.land;const W=LAND?1920:1080,H=LAND?1080:1920;const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const CW=58,X0=82;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));const ease=x=>1-Math.pow(1-clamp(x),3);const lerp=(a,b,t)=>a+(b-a)*t;
function rnd(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const logo=new Image();logo.src='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">'+CFG.mark+'</svg>');
function bg(){const g=ctx.createRadialGradient(W/2,H*0.35,100,W/2,H*0.35,1400);g.addColorStop(0,'#0E3B44');g.addColorStop(0.55,'#082229');g.addColorStop(1,'#06141A');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function header(a=1){ctx.save();ctx.globalAlpha=a;const hx=LAND?X0:W/2-340,hy=LAND?38:92;if(logo.complete)ctx.drawImage(logo,hx,hy,84,84);ctx.fillStyle='#EFFFFA';ctx.font='900 46px Montserrat';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText('MOLECULAR MELODIES',hx+98,hy+42);ctx.restore();}
function text(s,x,y,size,w,color,al='center',stroke=0){ctx.font=`${w} ${size}px Montserrat`;ctx.textAlign=al;ctx.textBaseline='middle';if(stroke){ctx.lineWidth=stroke;ctx.strokeStyle='rgba(2,10,14,.9)';ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=color;ctx.fillText(s,x,y);}
function hexes(tv){ctx.save();for(let i=0;i<16;i++){const sp=14+rnd(i+3)*26;const x=rnd(i)*W;const y=H+80-((tv*sp+rnd(i+9)*(H+200))%(H+200));const r=26+rnd(i+5)*70;ctx.strokeStyle=i%3===0?'rgba(245,200,75,.10)':'rgba(74,222,128,.10)';ctx.lineWidth=3;ctx.beginPath();for(let k=0;k<6;k++){const g=Math.PI/3*k+tv*0.1*(i%2?1:-1);ctx.lineTo(x+r*Math.cos(g),y+r*Math.sin(g));}ctx.closePath();ctx.stroke();}ctx.restore();}
function progress(tv,t){const p=clamp(t/(CFG.T-CFG.END));const x0=LAND?X0:81,w=LAND?18*CW:918,y=LAND?138:200;ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle='rgba(239,255,250,.18)';rr(x0,y,w,6,3);ctx.fill();ctx.fillStyle='#4ADE80';rr(x0,y,Math.max(6,w*p),6,3);ctx.fill();ctx.restore();}
function lyric(tv){let L=null;for(let i=0;i<CFG.lines.length;i++){const l=CFG.lines[i];const s=l.words[0][1]-0.3;let e=l.words[l.words.length-1][2]+0.5;const n=CFG.lines[i+1];if(n)e=Math.min(e,n.words[0][1]-0.05);if(tv>=s&&tv<e){L=l;break;}}
 if(!L)return;const ws=L.words;const full=ws.map(w=>w[0]).join(' ');let rows=[ws];const LIM=LAND?44:24;if(full.length>LIM){const n=Math.max(2,Math.ceil(full.length/(LAND?46:29)));const tgt=full.length/n;rows=[];let cur=[],len=0;for(let i=0;i<ws.length;i++){const wl=ws[i][0].length+1;if(cur.length&&rows.length<n-1&&len+wl/2>tgt*(rows.length+1)-0){rows.push(cur);cur=[];}cur.push(ws[i]);len+=wl;}rows.push(cur);}
 const fade=ease((tv-(ws[0][1]-0.3))/0.2);ctx.save();ctx.globalAlpha=fade;let FS=LAND?72:62;ctx.font=`900 ${FS}px Montserrat`;{let mw=0;rows.forEach(r=>{mw=Math.max(mw,r.map(w=>ctx.measureText(w[0]+' ').width).reduce((a,b)=>a+b,0));});if(mw>W-110){FS=Math.floor(FS*(W-110)/mw);ctx.font=`900 ${FS}px Montserrat`;}}rows.forEach((r,ri)=>{const total=r.map(w=>ctx.measureText(w[0]+' ').width).reduce((a,b)=>a+b,0);let x=W/2-total/2;const y=(LAND?930:1290)+ri*80-(rows.length-1)*40;
  r.forEach(w=>{const wd=ctx.measureText(w[0]+' ').width;const on=tv>=w[1];const pop=on?1+0.08*clamp(1-(tv-w[1])/0.2):1;const cx=x+ctx.measureText(w[0]).width/2;ctx.save();ctx.translate(cx,y);ctx.scale(pop,pop);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=9;ctx.strokeStyle='rgba(2,10,14,.92)';ctx.lineJoin='round';ctx.strokeText(w[0],0,0);ctx.fillStyle=on?'#4ADE80':'#FFFFFF';ctx.fillText(w[0],0,0);ctx.restore();x+=wd;});});ctx.restore();}
