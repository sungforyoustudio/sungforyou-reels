function pos(z){ // [row(0-based), col(0-based), f]
 if(z==1)return[0,0];if(z==2)return[0,17];
 if(z<=4)return[1,z-3];if(z<=10)return[1,12+(z-5)];
 if(z<=12)return[2,z-11];if(z<=18)return[2,12+(z-13)];
 if(z<=36)return[3,z-19];if(z<=54)return[4,z-37];
 if(z<=56)return[5,z-55];if(z<=70)return[7.4,2+(z-57)];if(z==71)return[5,2];if(z<=86)return[5,3+(z-72)];
 if(z<=88)return[6,z-87];if(z<=102)return[8.4,2+(z-89)];if(z==103)return[6,2];return[6,3+(z-104)];}
const ALK=[3,11,19,37,55,87],AE=[4,12,20,38,56,88],HAL=[9,17,35,53,85,117],NOB=[2,10,18,36,54,86,118],NM=[1,6,7,8,15,16,34],MD=[5,14,32,33,51,52];
function fam(z){if(ALK.includes(z))return'alk';if(AE.includes(z))return'ae';if(HAL.includes(z))return'hal';if(NOB.includes(z))return'nob';if(NM.includes(z))return'nm';if(MD.includes(z))return'md';
 if((z>=57&&z<=70)||(z>=89&&z<=102))return'inner';if((z>=21&&z<=30)||(z>=39&&z<=48)||z==71||(z>=72&&z<=80)||z==103||(z>=104&&z<=112))return'tm';return'pt';}
const COL={alk:'#FF7A8A',ae:'#FFB86B',tm:'#7DD3FC',hal:'#4ADE80',nob:'#C4A8FF',nm:'#2DD4BF',md:'#7C9CA6',pt:'#5F8089',inner:'#4B6A73'};
const NMs=[1,2,6,7,8,9,10,15,16,17,18,34,35,36,53,54,85,86,117,118],MDs=[5,14,32,33,51,52];
function cls(z){return fam(z);}function cls_old(z){if(MDs.includes(z))return'md';if(NMs.includes(z))return'nm';if((z>=57&&z<=71)||(z>=89&&z<=103))return'in';return'mt';}
const P=new URLSearchParams(location.search).get('o')==='L'?false:true;

function table(x,y,cw,ch,fs){let h='<div class="tbl" style="left:'+x+'px;top:'+y+'px">';
 for(let z=1;z<=118;z++){const[r,c]=pos(z);const k=cls(z);h+='<div class="cell '+k+''+'" style="left:'+(c*cw)+'px;top:'+(r*ch)+'px;width:'+(cw-4)+'px;height:'+(ch-4)+'px;font-size:'+fs+'px">'+SYM[z-1]+'</div>';}
 return h+'</div>';}
function hexes(n){let h='';for(let i=0;i<n;i++){const s=120+((i*97)%260),x=((i*313)%100),y=((i*191)%100);h+='<svg class="hex" style="left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px" viewBox="0 0 100 100"><polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="none" stroke="#4ADE80" stroke-width="2"/></svg>';}return h;}

 table(81,1010,51,54,24)+

 '<div style="position:absolute;left:0;right:0;top:1660px;text-align:center;font-size:36px;font-weight:700;color:#cfe8ee">Same column, same behavior</div>';

 table(1035,260,47,54,21);
